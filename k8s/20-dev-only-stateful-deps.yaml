# =====================================================================================
# Postgres, Redis, and Kafka for LOCAL/DEV KUBERNETES CLUSTERS ONLY (kind, minikube, a
# personal dev namespace on a shared cluster).
#
# DO NOT run these StatefulSets in production. At the scale this system is designed
# for (see README "Scaling to 20M users"), self-hosting stateful infrastructure inside
# Kubernetes means YOU own replication, failover, backups, patching, and disk
# management for your system of record — the exact operational burden managed services
# exist to remove. Use instead:
#   - PostgreSQL  -> Amazon RDS / Aurora PostgreSQL (or Cloud SQL / Azure Database)
#   - Redis       -> Amazon ElastiCache for Redis (or Memorystore / Azure Cache)
#   - Kafka       -> Amazon MSK (or Confluent Cloud)
# Point the ConfigMap/Secret (01-configmap.yaml, 02-secrets.yaml) DB_URL / REDIS_HOST /
# KAFKA_BOOTSTRAP_SERVERS at those managed endpoints instead of the in-cluster service
# names below, and simply omit this file entirely in a production overlay.
# =====================================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: walletsys
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: walletsys
            - name: POSTGRES_USER
              value: walletsys
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: walletsys-secrets, key: DB_PASSWORD }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "walletsys"]
            periodSeconds: 5
      # Local storage class name varies by cluster (kind/minikube usually provide
      # "standard"); override via kustomize/Helm values for other environments.
  volumeClaimTemplates:
    - metadata: { name: postgres-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: walletsys
spec:
  clusterIP: None   # headless — StatefulSet pods get stable DNS names
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: walletsys
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: redis-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: walletsys
spec:
  clusterIP: None
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: walletsys
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1
          ports:
            - { containerPort: 9092, name: external }
            - { containerPort: 29092, name: internal }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:29092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka:29093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk" }
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata: { name: kafka-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: walletsys
spec:
  clusterIP: None
  selector: { app: kafka }
  ports:
    - { port: 9092, targetPort: 9092, name: external }
    - { port: 29092, targetPort: 29092, name: internal }

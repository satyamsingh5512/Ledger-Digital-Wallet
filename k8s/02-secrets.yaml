# Placeholder Secret manifest. DO NOT commit real secret values to source control.
#
# In production, this should be created and managed one of these ways instead of a
# plain checked-in manifest:
#   - External Secrets Operator syncing from AWS Secrets Manager / GCP Secret Manager /
#     HashiCorp Vault (recommended — secrets never touch the git repo or `kubectl apply`
#     history at all)
#   - Sealed Secrets (bitnami-labs/sealed-secrets) if you want to keep a GitOps workflow
#     with an encrypted secret committed to git
#   - At minimum, `kubectl create secret generic walletsys-secrets --from-literal=...`
#     run manually/via CI with values injected from a secrets manager, never from a file
#     in the repo
#
# The stringData values below are placeholders for local `kind`/`minikube` testing only.
apiVersion: v1
kind: Secret
metadata:
  name: walletsys-secrets
  namespace: walletsys
type: Opaque
stringData:
  JWT_SECRET: "CHANGE-ME-generate-with-openssl-rand-base64-32-minimum-256-bits"
  DB_PASSWORD: "CHANGE-ME"
  REDIS_PASSWORD: ""
  GRAFANA_ADMIN_PASSWORD: "CHANGE-ME"

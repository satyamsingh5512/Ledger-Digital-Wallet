# Scales the app deployment based on CPU/memory utilization. Because the app is stateless
# (JWT auth, no server-side session, wallet state lives in Postgres/Redis) any replica
# can serve any request, so horizontal scaling is safe without sticky sessions.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: walletsys-app-hpa
  namespace: walletsys
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: walletsys-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Wait 5 minutes of sustained low load before scaling down, to avoid flapping
      # (scale up, scale down, scale up again) under bursty traffic patterns.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30

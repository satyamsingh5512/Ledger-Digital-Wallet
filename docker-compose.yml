name: walletsys

# =====================================================================================
# Full local stack: Postgres, Redis, Kafka (KRaft mode — no Zookeeper needed), the
# WalletSys app itself, Prometheus, and Grafana.
#
# Kafka runs in KRaft mode (single combined broker+controller node) rather than the
# classic Zookeeper-based setup: it's the modern, simpler default as of Kafka 3.x+,
# removes an entire stateful service from this compose file, and is what new Kafka
# deployments should use going forward (Zookeeper mode is deprecated upstream).
# =====================================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: walletsys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: walletsys
      POSTGRES_USER: walletsys
      POSTGRES_PASSWORD: walletsys
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletsys -d walletsys"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [walletsys-net]

  redis:
    image: redis:7-alpine
    container_name: walletsys-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [walletsys-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: walletsys-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # host-accessible listener
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [walletsys-net]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: walletsys-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/walletsys
      DB_USERNAME: walletsys
      DB_PASSWORD: walletsys
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-minimum-256-bits-long-please}
    ports:
      - "8080:8080"
    networks: [walletsys-net]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: walletsys-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks: [walletsys-net]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: walletsys-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [walletsys-net]

networks:
  walletsys-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
